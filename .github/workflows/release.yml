name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nautilus-cli-linux-x86_64
            asset_name: nautilus-cli-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nautilus-cli-windows-x86_64.exe
            asset_name: nautilus-cli-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nautilus-cli-macos-arm64
            asset_name: nautilus-cli-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI Binary
        run: cargo build --release -p nautilus-cli --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }} nautilus-cli

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/nautilus-cli.exe" -DestinationPath "${{ matrix.asset_name }}"

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  build-studio:
    name: Build Studio Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crates/nautilus-studio/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd crates/nautilus-studio
          npm ci

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/nautilus-studio
          tagName: ${{ github.ref_name }}
          releaseName: 'Nautilus Studio ${{ github.ref_name }}'
          releaseBody: 'See release notes for details.'
          releaseDraft: true
          prerelease: false

  publish-release:
    name: Publish Draft Release
    needs: [build-cli, build-studio]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all CLI Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Upload CLI Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
          draft: false