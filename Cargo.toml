[workspace]
resolver = "2"
members = [
    "crates/nautilus-core",
    "crates/nautilus-cli",
    "crates/nautilus-studio/src-tauri",
]


[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "1.0"
petgraph = "0.6"
async-trait = "0.1"
